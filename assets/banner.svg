<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071527"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .highlight-text {
      fill: url(#primary-grad);
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag-badge {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    
    /* CSS Animations */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-12px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.4; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes shield-pulse {
      0% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.8)); }
      100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
    }

    .anim-pulse { animation: pulse-ring 6s infinite ease-in-out; transform-origin: center; }
    .anim-float1 { animation: float-particle 4s infinite ease-in-out; }
    .anim-float2 { animation: float-particle 5s infinite ease-in-out 1s; }
    .anim-dash { stroke-dasharray: 8 12; animation: dash-flow 3s linear infinite; }
    .anim-shield { animation: shield-pulse 4s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Cyber Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350"/>
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400"/>
  </g>

  <!-- Background Ambient Glow Orbs -->
  <circle cx="1000" cy="100" r="220" fill="url(#glow-grad)" filter="url(#soft-glow)"/>
  <circle cx="150" cy="320" r="180" fill="url(#glow-grad)" filter="url(#soft-glow)"/>

  <!-- Dynamic Cyber Network Nodes (Background Layer) -->
  <g class="anim-float1" opacity="0.35">
    <line x1="850" y1="120" x2="980" y2="80" stroke="#00f2fe" stroke-width="1.5" class="anim-dash"/>
    <line x1="980" y1="80" x2="1080" y2="180" stroke="#00f2fe" stroke-width="1.5" class="anim-dash"/>
    <line x1="1080" y1="180" x2="940" y2="280" stroke="#00f2fe" stroke-width="1.5" class="anim-dash"/>
    <line x1="940" y1="280" x2="850" y2="120" stroke="#00f2fe" stroke-width="1.5"/>

    <circle cx="850" cy="120" r="6" fill="#00f2fe" filter="url(#neon-glow)"/>
    <circle cx="980" cy="80" r="8" fill="#38bdf8" filter="url(#neon-glow)"/>
    <circle cx="1080" cy="180" r="7" fill="#4facfe" filter="url(#neon-glow)"/>
    <circle cx="940" cy="280" r="9" fill="#00c6ff" filter="url(#neon-glow)"/>
  </g>

  <g class="anim-float2" opacity="0.25">
    <circle cx="1020" cy="310" r="4" fill="#38bdf8"/>
    <circle cx="780" cy="260" r="5" fill="#4facfe"/>
    <circle cx="900" cy="60" r="4" fill="#00f2fe"/>
  </g>

  <!-- Right Decorative Shield Graphic (Dynamic Floating Element) -->
  <g transform="translate(940, 200)" class="anim-shield">
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#primary-grad)" stroke-width="2" class="anim-pulse" opacity="0.5"/>
    <polygon points="0,-65 55,-35 55,30 0,70 -55,30 -55,-35" fill="url(#shield-grad)" opacity="0.85"/>
    <polygon points="0,-55 45,-28 45,25 0,60 -45,25 -45,-28" fill="#071527"/>
    <!-- Lock / DNS Symbol -->
    <path d="M-15,-5 L15,-5 L15,-18 C15,-27 -15,-27 -15,-18 Z M-22,-5 L22,-5 L22,22 L-22,22 Z" fill="url(#primary-grad)"/>
    <circle cx="0" cy="8" r="4" fill="#071527"/>
  </g>

  <!-- FOREGROUND CONTENT (Protected Layer - Unobscured Text & Badges) -->
  <g transform="translate(80, 0)">
    
    <!-- Category Tag Pill -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#0f2942" stroke="#1e4976" stroke-width="1.5"/>
      <text x="16" y="21" class="tag-badge">🛡️ CYBERSECURITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text">
      Awesome <tspan class="highlight-text">DNS Security</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" class="subtitle-text">
      Curated Protective DNS, Threat Intelligence &amp; Encrypted Filtering
    </text>

    <!-- Subtitle Details -->
    <text x="0" y="248" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748b">
      SaaS Platforms • Open-Source Sinkholes • DoH / DoT Proxies • Threat Feeds
    </text>

    <!-- Decorative Bottom Accent Line -->
    <rect x="0" y="290" width="520" height="4" rx="2" fill="url(#primary-grad)" filter="url(#neon-glow)"/>

    <!-- Key Metric Pills -->
    <g transform="translate(0, 318)">
      <!-- Pill 1: Protective DNS -->
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔒 Protective DNS</text>

      <!-- Pill 2: DoH & DoT -->
      <rect x="162" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="174" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ DoH / DoT / DoQ</text>

      <!-- Pill 3: Self-Hosted -->
      <rect x="309" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="321" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🌐 Open-Source</text>
    </g>

  </g>
</svg>
